name: release-packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: >-
          DISTRIB_ARCH（路由器执行: . /etc/openwrt_release; echo $DISTRIB_ARCH）。
          ipq50xx/ipq50xx_32 + armv7l 常见为 arm_cortex-a7_neon-vfpv4，请先确认。
        type: string
        default: arm_cortex-a7_neon-vfpv4
      branch:
        description: >-
          OpenWrt SDK 版本（路由器 23.05-SNAPSHOT 请选 23.05.6，勿选 openwrt-23.05）。
        type: choice
        options:
          - 23.05.6
          - openwrt-24.10
          - openwrt-25.12
          - SNAPSHOT
        default: 23.05.6
      release_tag:
        description: GitHub Release 标签名（仅单目标手动发布时使用）
        type: string
        default: ipq50xx_32-23.05-SNAPSHOT
      prerelease:
        description: 标记为预发布版本
        type: boolean
        default: true
      build_all:
        description: 编译并发布全部架构矩阵（取消勾选则仅编译上方 arch/branch）
        type: boolean
        default: false
  push:
    tags:
      - v*

jobs:
  release-single:
    if: github.event_name == 'workflow_dispatch' && inputs.build_all != true
    name: ${{ inputs.arch }}-${{ inputs.branch }} release
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ inputs.arch }}-${{ inputs.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          tar -c -z -f nikki_${{ inputs.arch }}-${{ inputs.branch }}.tar.gz -C bin/packages/${{ inputs.arch }}/nikki .
          mkdir -p release-ipk
          cp bin/packages/${{ inputs.arch }}/nikki/*.ipk release-ipk/

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }} (${{ inputs.arch }}-${{ inputs.branch }})
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            nikki_${{ inputs.arch }}-${{ inputs.branch }}.tar.gz
            release-ipk/*

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: nikki_${{ inputs.arch }}-${{ inputs.branch }}
          path: |
            nikki_${{ inputs.arch }}-${{ inputs.branch }}.tar.gz
            release-ipk

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_all == true)
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a9_neon
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - mips64_octeonplus
          - riscv64_riscv64
          - riscv64_generic
          - loongarch64_generic
          - i386_pentium4
          - x86_64
        branch:
          - 23.05.6
          - openwrt-24.10
          - openwrt-25.12
          - SNAPSHOT
        exclude:
          - arch: mips_4kec
            branch: openwrt-25.12
          - arch: mips_4kec
            branch: SNAPSHOT
          - arch: riscv64_riscv64
            branch: openwrt-25.12
          - arch: riscv64_riscv64
            branch: SNAPSHOT
          - arch: riscv64_generic
            branch: openwrt-24.10

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          tar -c -z -f nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz -C bin/packages/${{ matrix.arch }}/nikki .
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          mv bin/packages/${{ matrix.arch }}/nikki public/${{ matrix.branch }}/${{ matrix.arch }}
          tar -c -z -f feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz public/${{ matrix.branch }}/${{ matrix.arch }}

      - if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        name: prepare ipk assets
        run: |
          mkdir -p release-ipk
          cp bin/packages/${{ matrix.arch }}/nikki/*.ipk release-ipk/

      - if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz
            release-ipk/*

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

  feed:
    needs: release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_all == true)
    name: feed
    runs-on: ubuntu-latest

    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_nikki_*
          merge-multiple: true

      - name: uncompress
        run: |
          for file in feed_nikki_*.tar.gz; do tar -x -z -f "$file"; done

      - name: prepare
        run: |
          echo "${{ secrets.KEY_BUILD_PUB }}" > public/key-build.pub
          echo "${{ secrets.PUBLIC_KEY }}" > public/public-key.pem
          tree --dirsfirst --sort name -P '*.apk|*.ipk' --prune --noreport -H "" -T "Nikki's Feed" --charset utf-8 -o public/index.html public
          sed -i '/<p class="VERSION">/,/<\/p>/d' public/index.html

      - name: feed
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=nikkinikki
